<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>配属可能日の確認｜ページが新しくなりました</title>
<!-- 配属日の計算のページの引っ越し（2026-10 大分外国人研修センター）。
     移る先：新しい公開の配属日計算のページ（ログインなし）。
     「?」と「#」のあとの値は、そのまま移る先へ付けて渡す。
     スクリプトが動かないときは、8秒で「?」なしの移る先へ移る（meta refresh）。 -->
<meta http-equiv="refresh" content="8;url=https://center-system.pages.dev/%E9%85%8D%E5%B1%9E%E5%8F%AF%E8%83%BD%E6%97%A5%E3%81%AE%E7%A2%BA%E8%AA%8D">
<style>
  :root{--ink:#16202b;--sub:#5c6672;--line:#e4e2da;--paper:#f6f4ee;--card:#fff;--indigo:#23395d;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  main{max-width:560px;margin:0 auto;padding:48px 16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;}
  .eyebrow{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.04em;}
  h1{font-size:21px;margin:6px 0 14px;letter-spacing:.03em;}
  p{margin:0 0 12px;font-size:15px;}
  .byo{font-weight:700;color:var(--indigo);}
  a.go{display:block;text-align:center;margin:20px 0 10px;padding:13px 16px;border-radius:10px;
    background:var(--indigo);color:#fff;font-weight:700;text-decoration:none;font-size:16px;}
  .url{font-size:12.5px;color:var(--sub);word-break:break-all;}
  .note{font-size:13px;color:var(--sub);margin-top:16px;}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow">入国後講習センター</div>
    <h1>配属日の計算のページが新しくなりました。<br>自動で移動します。</h1>
    <p><span class="byo" id="byo">5</span> 秒後に新しいページへ移動します。</p>
    <p>移動しないときは、下のボタンを押してください。</p>
    <a class="go" id="go" href="https://center-system.pages.dev/%E9%85%8D%E5%B1%9E%E5%8F%AF%E8%83%BD%E6%97%A5%E3%81%AE%E7%A2%BA%E8%AA%8D">新しいページを開く</a>
    <div class="url" id="url">https://center-system.pages.dev/配属可能日の確認</div>
    <p class="note">ブックマーク（お気に入り）をお使いの方は、新しいページのアドレスに登録し直してください。</p>
  </div>
</main>
<script>
(function () {
  var SAKI = 'https://center-system.pages.dev/%E9%85%8D%E5%B1%9E%E5%8F%AF%E8%83%BD%E6%97%A5%E3%81%AE%E7%A2%BA%E8%AA%8D';
  var BYO = 5;
  // 「?」と「#」のあとの値は、そのまま引き継ぐ
  var url = SAKI + (location.search || '') + (location.hash || '');
  document.getElementById('go').href = url;
  var n = BYO, el = document.getElementById('byo');
  var t = setInterval(function () {
    n -= 1;
    if (n > 0) { el.textContent = n; return; }
    clearInterval(t);
    el.textContent = 0;
    location.replace(url);
  }, 1000);
})();
</script>
</body>
</html>
